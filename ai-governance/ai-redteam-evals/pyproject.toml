[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-redteam-evals"
version = "0.1.0"
description = "Offline AI red-team and eval harness: attack library, scoring, regression, reports."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.setuptools]
packages = ["redteam"]
