[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compliance-hub"
version = "0.1.0"
description = "AI GRC: control library, framework mapping, risk register, evidence trail, and cards."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.setuptools]
packages = ["compliance_hub"]
