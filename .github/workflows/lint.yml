name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l platform identity/oiaf identity/open-pam-jit ai-security/open-ai-gateway offensive/attack-path 2>/dev/null)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (dev tools only)
        run: npm ci
      - name: Biome lint (TS/JS components)
        run: >
          npx @biomejs/biome ci
          identity/agent-identity
          ai-security/ai-access-broker
          ai-security/mcp-security-gateway
          offensive/pentest-manager
          soc/open-soar
