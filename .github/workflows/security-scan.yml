name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  go-vuln:
    runs-on: ubuntu-latest
    # Informational, not gating: this job is deliberately NOT in main's
    # required-status-check list, so a finding surfaces without blocking PRs.
    # The steps below no longer swallow their exit codes (they used to end in
    # `|| true`), so a vulnerability now shows up as a real job failure in the
    # UI instead of a permanently green badge that proves nothing.
    continue-on-error: true
    strategy:
      matrix:
        # Every Go module in the repo. This list previously covered only 4 of
        # the 8 modules: offensive/credential-intel, offensive/live-recon,
        # offensive/username-enum and platform were never scanned at all.
        dir:
          - identity/oiaf
          - identity/open-pam-jit
          - ai-security/open-ai-gateway
          - offensive/attack-path
          - offensive/credential-intel
          - offensive/live-recon
          - offensive/username-enum
          - platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # A floor, not an exact pin. Each module's go.mod now carries
          # `toolchain go1.26.6`, patched against the GO-2026-6218 (net/url),
          # GO-2026-6090 (crypto/tls), GO-2026-6089 (net/http) and
          # GO-2026-5972 (encoding/asn1) stdlib advisories.
          go-version: ">=1.26.6"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd ${{ matrix.dir }} && "$(go env GOPATH)/bin/govulncheck" ./...)

  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        dir:
          - identity/agent-identity
          - ai-security/ai-access-broker
          - ai-security/mcp-security-gateway
          - offensive/pentest-manager
          - soc/open-soar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
