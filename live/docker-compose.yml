# osp-live-proof — local Mock->Real connector proof stack.
#
# FOR LOCAL DEVELOPMENT ONLY. Every published port is bound to 127.0.0.1;
# nothing in this stack may ever be reachable from the network. Credentials
# come from live/.env (generated from .env.example by scripts/gen-env.sh) and
# must never be committed.
#
# Brings up the four services named in ROADMAP.md "Now" (Keycloak, Wazuh
# single-node manager, DefectDojo, OpenBao) plus Ollama for the AI-gateway
# provider proof, and the minimal supporting services each of them requires
# (Wazuh indexer + one-shot cert generator; DefectDojo's postgres/valkey/
# initializer/uwsgi/celery/nginx — mirroring upstream's own compose topology).
#
# Use `make up` from live/ (or `make live-up` at the repo root); see
# live/README.md. A bare `docker compose up -d` will fail on first run because
# the Wazuh TLS certificates are generated first by a one-shot service
# (profile "setup") and the pinned Wazuh config files are fetched by
# scripts/fetch-wazuh-config.sh.
name: osp-live-proof

services:
  # --- OIDC provider (platform/auth target) --------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      osp:
        aliases: [keycloak.osp.local]
    # The Keycloak image is ubi-micro: no curl, no grep — but bash and
    # coreutils are present, so probe the management interface (port 9000,
    # enabled via KC_HEALTH_ENABLED) with a bash /dev/tcp HTTP/1.0 request.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && IFS= read -r status_line <&3 && case \"$$status_line\" in *200*) exit 0 ;; *) exit 1 ;; esac'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # --- Wazuh single-node (manager + its required indexer) --------------------
  # Config files under ./config/wazuh/ are fetched (sha256-verified, pinned to
  # wazuh-docker v4.14.7) by scripts/fetch-wazuh-config.sh; certificates are
  # generated into ./config/wazuh/certs/ by the one-shot generator below
  # (`make certs` runs it before `up`; indexer/manager bind-mount its output).
  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    profiles: ["setup"]
    environment:
      CERT_TOOL_VERSION: "4.14"
    volumes:
      - ./config/wazuh/certs:/certificates
      - ./config/wazuh/certs.yml:/config/certs.yml:ro
    networks:
      osp:
        aliases: [wazuh-certs-generator.osp.local]

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    # NOTE: no depends_on for wazuh-certs-generator — it runs under the "setup"
    # profile as a one-shot (`make certs`) BEFORE `up`, and the bind mounts
    # below fail loudly if its output is missing. Depending on a profiled
    # service from a default-profile one has version-dependent behavior in
    # compose v2; the make targets enforce the order deterministically.
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    # Indexer port intentionally NOT published to the host: the proofs only
    # exercise the manager REST API (55000), which is what open-soar's Wazuh
    # connector story targets.
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./config/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./config/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./config/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./config/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./config/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      osp:
        # The TLS certificates are issued for CN=wazuh.indexer (certs.yml).
        aliases: [wazuh.indexer]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -u ${WAZUH_INDEXER_USER}:${WAZUH_INDEXER_PASSWORD} https://127.0.0.1:9200/ -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  wazuh:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    environment:
      INDEXER_URL: "https://wazuh.indexer:9200"
      INDEXER_USERNAME: ${WAZUH_INDEXER_USER}
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      # Consumed by the manager image's init script (create_user.py) to
      # create the REST API user the proofs authenticate with.
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      # Manager REST API only (the proof path). Agent-enrollment ports
      # (1514/1515/514) are intentionally NOT published: nothing in the
      # proofs enrolls agents.
      - "127.0.0.1:15500:55000"
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - wazuh_filebeat_etc:/etc/filebeat
      - wazuh_filebeat_var:/var/lib/filebeat
      - ./config/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat-key.pem:ro
      - ./config/wazuh/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks:
      osp:
        # The TLS certificates are issued for CN=wazuh.manager (certs.yml).
        aliases: [wazuh.manager]
    healthcheck:
      # Any HTTP response (even 401) proves the API daemon is up; the image
      # ships curl-minimal, so rely on curl's exit code, not the status.
      test: ["CMD-SHELL", "curl -sk -o /dev/null https://127.0.0.1:55000/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # --- DefectDojo (upstream's own service topology, loopback-only) ----------
  defectdojo-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: ${DD_DATABASE_USER}
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD}
    volumes:
      - defectdojo_postgres_data:/var/lib/postgresql/data
    networks:
      osp:
        aliases: [defectdojo-postgres.osp.local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DD_DATABASE_USER} -d defectdojo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  defectdojo-valkey:
    image: valkey/valkey:9.1.2-alpine
    volumes:
      - defectdojo_valkey_data:/data
    networks:
      osp:
        aliases: [defectdojo-valkey.osp.local]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: runs migrations + creates the admin user (DD_ADMIN_PASSWORD from
  # .env makes the credential deterministic for the proofs). uwsgi waits for
  # service_completed_successfully, mirroring upstream's compose.
  defectdojo-initializer:
    image: defectdojo/defectdojo-django:3.3.100
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "defectdojo-postgres:5432", "-t", "120", "--", "/entrypoint-initializer.sh"]
    environment: &defectdojo-env
      DD_DEBUG: "False"
      DD_DJANGO_METRICS_ENABLED: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: ${DD_ADMIN_USER}
      DD_ADMIN_MAIL: admin@defectdojo.osp.local
      DD_ADMIN_FIRST_NAME: OSP
      DD_ADMIN_LAST_NAME: Proof
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD}
      DD_DATABASE_URL: postgresql://${DD_DATABASE_USER}:${DD_DATABASE_PASSWORD}@defectdojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
      DD_CACHE_URL: redis://defectdojo-valkey:6379/1
      DD_SECRET_KEY: ${DD_SECRET_KEY}
      DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY}
      DD_DATABASE_READINESS_TIMEOUT: "120"
    networks:
      osp:
        aliases: [defectdojo-initializer.osp.local]

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:3.3.100
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "defectdojo-postgres:5432", "-t", "120", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    networks:
      osp:
        aliases: [defectdojo-uwsgi.osp.local]
    healthcheck:
      # entrypoint-uwsgi.sh also serves plain HTTP on :8081 for probes.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8081/login/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:3.3.100
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "defectdojo-postgres:5432", "-t", "120", "--", "/entrypoint-celery-worker.sh"]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    networks:
      osp:
        aliases: [defectdojo-celeryworker.osp.local]

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:3.3.100
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "defectdojo-postgres:5432", "-t", "120", "--", "/entrypoint-celery-beat.sh"]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    networks:
      osp:
        aliases: [defectdojo-celerybeat.osp.local]

  defectdojo:
    image: defectdojo/defectdojo-nginx:3.3.100
    depends_on:
      defectdojo-uwsgi:
        condition: service_healthy
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    networks:
      osp:
        aliases: [defectdojo.osp.local]
    healthcheck:
      # nginx:alpine base => busybox wget available, curl not guaranteed.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/login/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # --- OpenBao (open-pam-jit internal/bao target) ----------------------------
  openbao:
    image: openbao/openbao:2.6.2
    environment:
      # No command: needed — the image entrypoint runs `bao server -dev` with
      # these variables (dev mode: in-memory, initialized, unsealed, KV v2
      # mounted at secret/).
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:18200:8200"
    volumes:
      # Dev mode is in-memory and writes nothing here; the named volume exists
      # so a later switch to file-storage mode persists without compose edits.
      - openbao_data:/var/lib/openbao
    networks:
      osp:
        aliases: [openbao.osp.local]
    healthcheck:
      # `bao status` exits 0 when initialized+unsealed (always, in dev mode).
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- Ollama (open-ai-gateway real provider target) -------------------------
  ollama:
    image: ollama/ollama:0.34.2
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      osp:
        aliases: [ollama.osp.local]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  osp:
    driver: bridge

volumes:
  keycloak_data:
  wazuh_indexer_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  wazuh_filebeat_etc:
  wazuh_filebeat_var:
  defectdojo_postgres_data:
  defectdojo_valkey_data:
  defectdojo_media:
  openbao_data:
  ollama_data:
