[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Confined, limited, recorded execution runtime for AI agents."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.setuptools]
packages = ["agent_sandbox"]
